<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nube Personal - Almacenamiento</title>
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      height: 100vh;
      background: url('fondo.png') no-repeat center center/cover;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: -1;
    }

    .container {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(15px);
      padding: 30px 40px;
      border-radius: 20px;
      text-align: center;
      width: 95%;
      max-width: 900px;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    h1 {
      font-size: 1.9rem;
      margin-bottom: 15px;
    }

    .upload-section {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="file"] {
      color: white;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 5px;
    }

    button {
      background: rgba(255,255,255,0.1);
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: rgba(0,191,255,0.4);
      transform: scale(1.05);
    }

    .search-bar {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .search-bar input {
      width: 70%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.15);
      color: white;
      text-align: center;
      font-size: 1rem;
    }

    .file-list {
      margin-top: 25px;
      background: rgba(255,255,255,0.05);
      padding: 15px;
      border-radius: 10px;
      max-height: 350px;
      overflow-y: auto;
      text-align: left;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: rgba(255,255,255,0.12);
      margin-bottom: 10px;
      border-radius: 10px;
      transition: 0.3s;
      font-size: 1rem;
    }

    .file-item:hover {
      background: rgba(0,191,255,0.25);
      transform: scale(1.01);
    }

    .file-info {
      display: flex;
      flex-direction: column;
    }

    .file-info small {
      opacity: 0.7;
      font-size: 0.8rem;
    }

    .actions i {
      font-size: 22px;
      margin-left: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .actions i:hover {
      color: #00bfff;
      transform: scale(1.2);
    }

    .back {
      display: inline-block;
      margin-top: 15px;
      color: white;
      text-decoration: none;
    }

    .back:hover {
      color: #00bfff;
    }

    .export-btn {
      margin-top: 15px;
      background: rgba(0,191,255,0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class='bx bx-folder'></i> Nube Personal de Documentos</h1>

    <div class="upload-section">
      <input type="file" id="fileInput" multiple>
      <button id="saveBtn"><i class='bx bx-upload'></i> Guardar Archivos</button>
      <button id="exportBtn" class="export-btn"><i class='bx bx-export'></i> Exportar Todo</button>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Buscar documento...">
      <i class='bx bx-search'></i>
    </div>

    <div class="file-list" id="fileList">
      <p style="text-align:center; opacity:0.7;">No hay documentos guardados</p>
    </div>

    <a href="index.html" class="back"><i class='bx bx-arrow-back'></i> Volver al inicio</a>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const saveBtn = document.getElementById('saveBtn');
    const exportBtn = document.getElementById('exportBtn');
    const fileList = document.getElementById('fileList');
    const searchInput = document.getElementById('searchInput');

    let storedFiles = JSON.parse(localStorage.getItem('documentosGuardados')) || [];

    function renderFiles(filter = "") {
      fileList.innerHTML = "";
      const filtered = storedFiles.filter(f => f.name.toLowerCase().includes(filter.toLowerCase()));
      if (filtered.length === 0) {
        fileList.innerHTML = "<p style='text-align:center; opacity:0.7;'>No se encontraron documentos</p>";
        return;
      }
      filtered.forEach((file, index) => {
        const item = document.createElement('div');
        item.classList.add('file-item');
        item.innerHTML = `
          <div class="file-info">
            <span><i class='bx bx-file'></i> ${file.name}</span>
            <small>${file.date} — ${file.size}</small>
          </div>
          <div class="actions">
            <i class='bx bx-download' title="Descargar" onclick="downloadFile(${index})"></i>
            <i class='bx bx-trash' title="Eliminar" onclick="deleteFile(${index})"></i>
          </div>
        `;
        fileList.appendChild(item);
      });
    }

    saveBtn.addEventListener('click', () => {
      const files = fileInput.files;
      if (files.length === 0) {
        alert("Selecciona al menos un archivo");
        return;
      }

      for (let file of files) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const date = new Date().toLocaleString();
          const size = (file.size / 1024).toFixed(1) + " KB";
          storedFiles.push({ name: file.name, data: e.target.result, date, size });
          localStorage.setItem('documentosGuardados', JSON.stringify(storedFiles));
          renderFiles();
        };
        reader.readAsDataURL(file);
      }

      fileInput.value = "";
    });

    function downloadFile(index) {
      const file = storedFiles[index];
      const link = document.createElement('a');
      link.href = file.data;
      link.download = file.name;
      link.click();
    }

    function deleteFile(index) {
      if (confirm("¿Seguro que deseas eliminar este documento?")) {
        storedFiles.splice(index, 1);
        localStorage.setItem('documentosGuardados', JSON.stringify(storedFiles));
        renderFiles(searchInput.value);
      }
    }

    exportBtn.addEventListener('click', () => {
      if (storedFiles.length === 0) {
        alert("No hay documentos para exportar");
        return;
      }
      const zipData = JSON.stringify(storedFiles);
      const blob = new Blob([zipData], { type: "application/json" });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = "respaldo_documentos.json";
      link.click();
    });

    searchInput.addEventListener('input', () => renderFiles(searchInput.value));

    renderFiles();
  </script>
</body>
</html>
